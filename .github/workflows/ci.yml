name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Compile Python modules
        run: python -m compileall -q local_ragbot
      - name: Smoke-test local commands
        run: |
          python -m local_ragbot agents --json
          python -m local_ragbot runtime --json
          python -m local_ragbot ingest data --dataset default --index-dir /tmp/local-ragbot-index
