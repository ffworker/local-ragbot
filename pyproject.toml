# changed: declare the runtime dependencies used by the FastAPI server, Ollama HTTP client, Chroma vector store, and local embedding stack.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ragbot"
version = "0.1.0"
description = "Tiny local-first RAG chatbot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[tool.setuptools]
packages = ["local_ragbot"]

[tool.ruff]
line-length = 100
